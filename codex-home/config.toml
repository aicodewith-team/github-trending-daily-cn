# 只给 trending-daily.sh 用的 Codex 配置（脚本会 export CODEX_HOME=./codex-home）
# 字段与 2026-10-12 实测运行时使用的配置一致（codex-cli 0.162.1）
model_provider = "aicodewith"
model = "gpt-5.6-sol"

[model_providers.aicodewith]
name = "aicodewith"
base_url = "https://api.aicodewith.ai/chatgpt/v1"
wire_api = "responses"
env_key = "AICW_API_KEY"          # Key 从环境变量读取，不写进本文件
supports_websockets = false
